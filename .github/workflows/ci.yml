name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: personal_finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d personal_finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://finance:finance@127.0.0.1:5432/personal_finance
      ENVIRONMENT: test
      AGENT_SHARED_SECRET: ci-agent-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Validate migrations against PostgreSQL
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Lint and test backend
        working-directory: backend
        run: |
          ruff check app tests
          ruff format --check app tests
          pytest -q
      - name: Test agent boundary
        run: |
          cd backend
          ruff check ../agent
          ruff format --check ../agent
          cd ..
          PYTHONPATH=. python -m pytest -q agent/tests
          python -m compileall -q backend/app agent

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test, lint, typecheck and build
        working-directory: frontend
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
