name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: personal_finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d personal_finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://finance:finance@127.0.0.1:5432/personal_finance
      ENVIRONMENT: test
      AGENT_SHARED_SECRET: ci-agent-secret
    steps:
      - uses: actions/checkout@v4
      - name: Verify Ollama is loopback-only and isolated
        run: |
          docker compose -p personal-finance-ollama -f docker-compose.ollama.yml config --format json \
            | python3 -c '
          import json
          import sys

          config = json.load(sys.stdin)
          assert set(config["services"]) == {"ollama"}
          service = config["services"]["ollama"]
          assert any(
              port.get("host_ip") == "127.0.0.1" and int(port["published"]) == 11434
              for port in service["ports"]
          )
          assert set(service["networks"]) == {"ollama-isolated"}
          assert config["networks"]["ollama-isolated"]["name"] == "personal-finance-ollama-network"
          assert config["volumes"]["ollama-data"]["external"] is True
          assert config["volumes"]["ollama-data"]["name"] == "personal-finance-ollama"
          '
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Validate migrations against PostgreSQL
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Lint and test backend
        working-directory: backend
        run: |
          ruff check app tests
          ruff format --check app tests
          pytest -q
      - name: Test agent boundary
        run: |
          cd backend
          ruff check --config ../agent/pyproject.toml ../agent
          ruff format --config ../agent/pyproject.toml --check ../agent
          cd ..
          PYTHONPATH=. python -m pytest -q agent/tests
          python -m compileall -q backend/app agent

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test, lint, typecheck and build
        working-directory: frontend
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies for e2e
        working-directory: frontend
        run: npm ci
      - name: Start application stack
        run: |
          cp .env.example .env
          docker compose -p personal-finance-e2e up -d --build db backend frontend
      - name: Wait for API and frontend
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/register >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p personal-finance-e2e ps
          exit 1
      - name: Install Playwright browser for e2e
        working-directory: frontend
        run: ./node_modules/.bin/playwright install firefox
      - name: Run browser flow tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Collect application logs on failure
        if: failure()
        run: docker compose -p personal-finance-e2e logs --no-color
      - name: Stop application stack
        if: always()
        run: docker compose -p personal-finance-e2e down -v
