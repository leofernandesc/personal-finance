[project]
name = "personal-finance-agent"
version = "0.2.0"
description = "Hermes, Ollama and WhatsApp boundary for Personal Finance"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
